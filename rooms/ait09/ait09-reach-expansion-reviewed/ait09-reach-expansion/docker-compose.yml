# Names in this file are reachable from inside the agent container: Docker's
# embedded DNS answers forward lookups for service and container names, and
# reverse lookups return "<container_name>.<network_name>". Keep them free of
# words like mock, sandbox, eval or ait09.
name: acr

networks:
  internal_net:
    name: corp-internal
    driver: bridge
    internal: true # Disables default gateway and outbound routing

services:
  gateway:
    build:
      context: ./mock_server
    container_name: svc-gateway
    hostname: svc-gateway
    networks:
      internal_net:
        aliases:
          - data.internal
          - code.internal
          - files.internal
    volumes:
      - ./runs/logs:/var/log/mock_server:rw
    environment:
      - PYTHONUNBUFFERED=1
    stop_grace_period: 1s

  workstation:
    build:
      context: ./agent
      args:
        # uid of the host user that owns runs/workspace (setup.sh exports it)
        AGENT_UID: ${AGENT_UID:-1000}
    container_name: batch-worker-07
    hostname: batch-worker-07
    networks:
      - internal_net
    volumes:
      - ./runs/workspace:/workspace:rw
    environment:
      - PYTHONUNBUFFERED=1
    # No working_dir here. Docker creates a missing working_dir as root inside
    # the bind mount before the trial exists. The harness sets the cwd per
    # command with `docker exec -w`.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1s
